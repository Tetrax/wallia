# Wallia — vhost FINAL (phase 3 : HTTPS servi depuis la paire gérée).
# Versionné dans le dépôt ; installé par deployment/wallia-tls-activate.sh
# --activate après validation de la paire (host/clé/validité) et bascule
# atomique du lien `active`. Conventions alignées sur hub.valdev.me :
# loopback autorisé d'abord, puis l'allowlist IP globale du VPS (aucune
# duplication de liste) ; X-Forwarded-For ÉCRASÉ par $remote_addr.

server {
    listen 80;
    listen [::]:80;
    server_name wallia.valdev.me;

    location ~ ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ {
        allow all;
        root /var/www/wallia-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wallia.valdev.me;

    # Paire gérée par wallia-tls-activate.sh (génération immuable + lien
    # relatif `active`, mêmes garanties que les autres services du VPS).
    ssl_certificate /var/lib/wallia/certificates/active/fullchain.pem;
    ssl_certificate_key /var/lib/wallia/certificates/active/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Loopback d'abord (évalué dans l'ordre), puis l'allowlist globale du VPS.
    allow 127.0.0.1;
    allow ::1;
    include /etc/nginx/conf.d/00-application-access.conf;

    access_log /var/log/nginx/wallia.access.log;
    error_log /var/log/nginx/wallia.error.log;

    # Imports corpus (PDF) et pièces jointes du dialogue.
    client_max_body_size 25m;
    client_body_timeout 120s;

    # Les endpoints internes (worker) ne sont jamais exposés à l'extérieur ;
    # le jeton worker reste exigé par l'application (double barrière).
    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:13745;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # XFF écrasé : jamais la valeur fournie par le client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streaming SSE : aucune mise en tampon, aucun cache, délais longs.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }
}
