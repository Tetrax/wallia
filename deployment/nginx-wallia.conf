# Wallia — exemple de vhost Nginx (À APPLIQUER PAR LE PRINCIPAL, non installé par l'implémenteur).
#
# Le prototype écoute en local sur 127.0.0.1:13745. Ce fichier sert de base ;
# adapter le nom de domaine, les chemins de certificats et les conventions
# observées sur le VPS (paires gérées, hooks de renouvellement) avant toute mise en service.
#
# Points importants :
#  - streaming SSE : proxy_buffering off, timeouts longs, HTTP/1.1 ;
#  - corps des requêtes limité (imports PDF/pièces jointes) ;
#  - l'application pose elle-même ses en-têtes de sécurité, ne pas les dupliquer.

map $http_upgrade $connection_upgrade_wallia {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name wallia.valdev.me;

    # Redirection permanente vers HTTPS (adapter si le vhost gère déjà ACME).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wallia.valdev.me;

    # Certificats : reprendre la paire gérée active du VPS (à adapter).
    ssl_certificate     /etc/letsencrypt/live/wallia.valdev.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallia.valdev.me/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Journaux dédiés.
    access_log /var/log/nginx/wallia.access.log;
    error_log  /var/log/nginx/wallia.error.log;

    # Taille maximale des imports (PDF de corpus et pièces jointes du dialogue).
    client_max_body_size 25m;
    client_body_timeout  120s;

    location / {
        proxy_pass http://127.0.0.1:13745;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Streaming SSE : pas de mise en tampon, pas de coupure prématurée.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # Interdire l'accès direct aux endpoints internes (double sécurité : le
    # jeton worker reste exigé par l'application).
    location /internal/ {
        return 404;
    }
}
