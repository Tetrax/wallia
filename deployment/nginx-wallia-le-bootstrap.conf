# Wallia — vhost INTERMÉDIAIRE « LE servi » (phase 2).
# Versionné dans le dépôt ; installé root-owned sous
# /etc/wallia/tls-templates/nginx-wallia-le-bootstrap.conf par l'opérateur,
# puis activé par deployment/wallia-tls-activate.sh --stage-le (sous verrou
# infra externe). Sert la paire Let's Encrypt TELLE QUELLE (lignée
# /etc/letsencrypt/live/wallia.valdev.me) pour prouver que HTTPS fonctionne
# AVANT la bascule vers la paire gérée sous /var/lib/wallia/certificates.

server {
    listen 80;
    listen [::]:80;
    server_name wallia.valdev.me;

    location ~ ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ {
        allow all;
        root /var/www/wallia-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wallia.valdev.me;

    # Paire Let's Encrypt servie temporairement (phase 2, sous verrou infra) :
    # la phase 3 (--activate) bascule vers /var/lib/wallia/certificates/active.
    ssl_certificate /etc/letsencrypt/live/wallia.valdev.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallia.valdev.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Loopback d'abord (évalué dans l'ordre), puis l'allowlist globale du VPS.
    allow 127.0.0.1;
    allow ::1;
    include /etc/nginx/conf.d/00-application-access.conf;

    access_log /var/log/nginx/wallia.access.log;
    error_log /var/log/nginx/wallia.error.log;

    client_max_body_size 25m;
    client_body_timeout 120s;

    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:13745;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }
}
