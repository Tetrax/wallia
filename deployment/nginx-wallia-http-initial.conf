# Wallia — vhost HTTP INITIAL (phase 1 : ACME + redirection seulement).
# Versionné dans le dépôt ; installé par deployment/wallia-tls-activate.sh
# --install-http (sous verrou infra externe). Aucune mutation hors de
# /etc/nginx/sites-{available,enabled}/wallia.valdev.me et du webroot ACME.

server {
    listen 80;
    listen [::]:80;
    server_name wallia.valdev.me;

    # Validation ACME ouverte publiquement, webroot DÉDIÉ (comme les autres
    # domaines du VPS) : rien d'autre n'est servi sur ce vhost.
    location ~ ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ {
        allow all;
        root /var/www/wallia-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
